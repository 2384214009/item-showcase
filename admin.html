<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>物品管理后台</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        :root{
            --primary:#2EB4A8;
            --primary-light:#e8f6f5;
            --primary-dark:#239a8f;
            --bg:#f5f7f8;
            --card:#ffffff;
            --text:#1a1a1a;
            --text-secondary:#6b7280;
            --text-muted:#9ca3af;
            --border:#e5e7eb;
            --danger:#ef4444;
            --danger-light:#fef2f2;
            --warn:#f59e0b;
            --warn-light:#fffbeb;
            --success:#10b981;
            --success-light:#ecfdf5;
            --radius-sm:8px;
            --radius-md:12px;
            --radius-lg:16px;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
            --shadow-md:0 4px 12px rgba(0,0,0,0.08);
        }
        html,body{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", sans-serif;
            background:var(--bg);
            color:var(--text);
            line-height:1.5;
            -webkit-font-smoothing:antialiased;
        }
        body{padding:16px;min-height:100vh;max-width:560px;margin:0 auto;}

        /* 登录页 */
        .login-box{
            max-width:400px;margin:40px auto;
            background:var(--card);padding:28px 24px;
            border-radius:var(--radius-lg);
            box-shadow:var(--shadow-md);
            border:1px solid var(--border);
        }
        .login-header{text-align:center;margin-bottom:24px;}
        .login-icon{
            width:56px;height:56px;border-radius:16px;
            background:linear-gradient(135deg,var(--primary),var(--primary-dark));
            display:flex;align-items:center;justify-content:center;
            font-size:28px;margin:0 auto 12px;
            box-shadow:0 4px 12px rgba(46,180,168,0.3);
        }
        h2{color:var(--text);text-align:center;margin-bottom:4px;font-size:20px;font-weight:700;}
        .login-subtitle{text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:20px;}
        h3{font-size:16px;margin-bottom:12px;color:var(--text);font-weight:700;}
        h4{font-size:14px;margin:14px 0 8px;color:var(--text-secondary);font-weight:600;}

        /* 标签页 */
        .tab{
            display:flex;flex-wrap:wrap;gap:6px;
            margin-bottom:16px;background:var(--card);
            padding:8px;border-radius:var(--radius-md);
            border:1px solid var(--border);
        }
        .tab-btn{
            flex:1 1 auto;min-width:70px;
            padding:9px 8px;border:none;border-radius:var(--radius-sm);
            background:transparent;font-size:12px;cursor:pointer;
            color:var(--text-secondary);transition:all 0.2s;
            font-weight:500;font-family:inherit;
        }
        .tab-btn:hover{background:var(--bg);color:var(--text);}
        .tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(46,180,168,0.25);}

        /* 面板 */
        .panel{
            display:none;background:var(--card);
            padding:18px;border-radius:var(--radius-md);
            margin-bottom:14px;border:1px solid var(--border);
            box-shadow:var(--shadow-sm);
        }
        .panel.show{display:block;animation:fadeIn 0.25s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

        /* 表单 */
        input,textarea,select{
            width:100%;padding:11px 14px;margin:8px 0;
            border:1px solid var(--border);border-radius:var(--radius-sm);
            font-size:14px;background:var(--card);outline:none;
            transition:all 0.2s;font-family:inherit;color:var(--text);
        }
        input:focus,textarea:focus,select:focus{
            border-color:var(--primary);
            box-shadow:0 0 0 3px rgba(46,180,168,0.1);
        }
        textarea{resize:vertical;min-height:70px;}
        input[type="file"]{padding:8px;border:1px dashed var(--border);background:var(--bg);cursor:pointer;}
        input[type="file"]:hover{border-color:var(--primary);}

        /* 按钮 */
        button{
            padding:10px 16px;border:none;border-radius:var(--radius-sm);
            margin:4px 4px 4px 0;font-size:13px;cursor:pointer;
            transition:all 0.15s;font-weight:600;font-family:inherit;
        }
        button:hover{transform:translateY(-1px);}
        button:active{transform:translateY(0);}
        .primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 2px 8px rgba(46,180,168,0.25);}
        .primary:hover{box-shadow:0 4px 12px rgba(46,180,168,0.35);}
        .danger{background:var(--danger-light);color:var(--danger);}
        .danger:hover{background:var(--danger);color:#fff;}
        .warning{background:var(--warn-light);color:var(--warn);}
        .warning:hover{background:var(--warn);color:#fff;}
        .ok{background:var(--success-light);color:var(--success);}
        .ok:hover{background:var(--success);color:#fff;}

        /* 物品项 */
        .goods-item{
            padding:14px 0;border-bottom:1px solid #f3f4f6;
        }
        .goods-item:last-child{border-bottom:none;}
        .goods-item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
        .goods-item-name{font-weight:600;font-size:15px;}
        .goods-item-desc{font-size:13px;color:var(--text-secondary);margin:6px 0;line-height:1.5;}
        .goods-item-actions{margin-top:8px;}

        /* 图片预览 */
        .preview-img{
            max-width:100%;max-height:200px;margin:10px 0;
            display:none;border-radius:var(--radius-sm);
            border:1px solid var(--border);object-fit:cover;
        }

        /* 徽章 */
        .badge{
            display:inline-block;font-size:11px;padding:3px 8px;
            border-radius:10px;color:#fff;margin:0 4px;font-weight:600;
        }
        .badge-pending{background:var(--warn);}
        .badge-done{background:var(--success);}
        .badge-sellout{background:var(--danger);}
        .badge-sale{background:var(--success);}

        /* 订单项 */
        .order-item{
            padding:14px 0;border-bottom:1px solid #f3f4f6;
        }
        .order-item:last-child{border-bottom:none;}
        .order-item-header{font-weight:600;font-size:14px;margin-bottom:8px;}
        .order-item-detail{font-size:13px;color:var(--text-secondary);line-height:1.8;}
        .order-item-detail > div{padding:2px 0;}
        .order-items-list{
            background:var(--bg);border-radius:var(--radius-sm);
            padding:8px 12px;margin:8px 0;font-size:13px;
        }
        .order-items-list > div{padding:2px 0;color:var(--text-secondary);}

        /* 复选框行 */
        .check-row{
            display:flex;align-items:center;gap:8px;
            margin:10px 0 14px 0;
        }
        .check-row input[type="checkbox"]{
            width:18px;height:18px;margin:0;cursor:pointer;
            accent-color:var(--primary);
        }
        .check-row label{font-size:13px;color:var(--text-secondary);cursor:pointer;}

        /* 提示文字 */
        .small-tip{font-size:12px;color:var(--text-muted);margin:4px 0;}

        /* 空状态 */
        .empty-state{text-align:center;padding:30px 20px;color:var(--text-muted);}
        .empty-state .empty-icon{font-size:36px;margin-bottom:8px;opacity:0.5;}
        .empty-state .empty-text{font-size:13px;}

        /* 底部操作 */
        .admin-footer{
            display:flex;gap:8px;margin-top:16px;
            padding-top:16px;border-top:1px solid var(--border);
        }
        .admin-footer button{flex:1;margin:0;}

        /* 当前账号显示 */
        .current-admin{
            background:var(--primary-light);
            padding:12px 16px;border-radius:var(--radius-sm);
            margin-bottom:16px;font-size:14px;
            color:var(--primary-dark);font-weight:600;
        }
    </style>
</head>
<body>
    <div class="login-box" id="loginWrap">
        <div class="login-header">
            <div class="login-icon">⚙️</div>
            <h2>管理员登录</h2>
            <div class="login-subtitle">物品信息登记平台管理后台</div>
        </div>
        <input placeholder="管理员账号" id="inpUser" autocapitalize="off" autocomplete="off">
        <input placeholder="管理员密码" type="password" id="inpPwd" autocapitalize="off" autocomplete="off">
        <div class="check-row">
            <input type="checkbox" id="rememberCheck">
            <label for="rememberCheck">在本设备保存账号密码</label>
        </div>
        <button class="primary" style="width:100%;margin:0;padding:13px;font-size:15px;" onclick="doLogin()">登录后台</button>
    </div>
    <div class="admin-wrap" id="adminWrap" style="display:none;">
        <div class="current-admin">当前账号：<span id="curAdminName"></span></div>
        <div class="tab">
            <button class="tab-btn active" onclick="switchTab('catManage',this)">分类管理</button>
            <button class="tab-btn" onclick="switchTab('addGoods',this)">新增物品</button>
            <button class="tab-btn" onclick="switchTab('goodsList',this)">物品列表</button>
            <button class="tab-btn" onclick="switchTab('order',this)">提交记录</button>
            <button class="tab-btn" onclick="switchTab('bulletinTab',this)">公告管理</button>
            <button class="tab-btn" onclick="switchTab('setting',this)">账号设置</button>
            <button class="tab-btn super-only" onclick="switchTab('adminManage',this)" style="display:none;">管理员管理</button>
        </div>
        <div class="panel show" id="catManage">
            <h3>新增物品分类</h3>
            <input placeholder="分类名称" id="catName">
            <button class="primary" onclick="addCat()">添加分类</button>
            <div id="catWrap"></div>
        </div>
        <div class="panel" id="addGoods">
            <h3>添加 / 编辑物品</h3>
            <input placeholder="物品名称" id="gName">
            <input placeholder="编号（数字）" id="gPrice">
            <select id="gCat"></select>
            <textarea placeholder="物品简介描述" id="gDesc"></textarea>
            <input type="file" accept="image/*" id="imgUpload">
            <div class="small-tip">选择本地图片作为封面</div>
            <img class="preview-img" id="imgPreview">
            <div class="check-row">
                <input type="checkbox" id="isSelloutEdit">
                <label for="isSelloutEdit">标记无库存</label>
            </div>
            <button class="primary" onclick="saveGoods()">保存物品</button>
        </div>
        <div class="panel" id="goodsList">
            <h3>全部物品</h3>
            <div id="goodsWrap"></div>
        </div>
        <div class="panel" id="order">
            <h3>用户提交记录 <span id="orderBadge"></span></h3>
            <div id="orderWrap"></div>
        </div>
        <div class="panel" id="bulletinTab">
            <h3>滚动公告弹幕管理</h3>
            <input placeholder="输入公告内容" id="bulletinContent">
            <div class="check-row">
                <input type="checkbox" id="bulletinEnable">
                <label for="bulletinEnable">启用这条公告</label>
            </div>
            <button class="primary" onclick="addBulletin()">新增公告</button>
            <div id="bulletinWrap"></div>
        </div>
        <div class="panel" id="setting">
            <h3>修改登录密码</h3>
            <input placeholder="原密码" type="password" id="oldPwd">
            <input placeholder="新密码(至少6位)" type="password" id="newPwd">
            <input placeholder="确认新密码" type="password" id="confirmPwd">
            <button class="primary" onclick="changePassword()">保存新密码</button>
        </div>
        <div class="panel" id="adminManage">
            <h3>管理员列表</h3>
            <div id="adminListWrap"></div>
            <h4>新增管理员</h4>
            <input placeholder="新管理员账号" id="newAdminUser">
            <input placeholder="初始密码(至少6位)" id="newAdminPwd">
            <div class="check-row">
                <input type="checkbox" id="newAdminSuper">
                <label for="newAdminSuper">设为超级管理员</label>
            </div>
            <button class="primary" onclick="addNewAdmin()">新增管理员</button>
        </div>
        <div class="admin-footer">
            <button onclick="location.href='index.html'">返回前台</button>
            <button class="danger" onclick="logout()">退出登录</button>
        </div>
    </div>
    <script>
        let currentLoginUser = "";
        let currentRole = "normal";
        let editTargetId = null;
        function getDb(){
            const raw = localStorage.getItem("shop_db");
            return raw ? JSON.parse(raw) : {
                goods:[],orders:[],categories:[],
                adminAccounts:[{username:"2384214009",pwd:"13727733582q",role:"super"},{username:"admin",pwd:"admin123",role:"normal"}],
                bulletins:[]
            };
        }
        function saveDb(db){localStorage.setItem("shop_db",JSON.stringify(db));}
        function loadRemember(){
            const rem = localStorage.getItem("admin_remember");
            if(rem){try{const obj=JSON.parse(atob(rem));document.getElementById("inpUser").value=obj.u;document.getElementById("inpPwd").value=obj.p;document.getElementById("rememberCheck").checked=true;}catch(e){}}
        }
        loadRemember();
        function doLogin(){
            const u=document.getElementById("inpUser").value.trim().toLowerCase();
            const p=document.getElementById("inpPwd").value.trim();
            const db=getDb();
            const findAdmin=db.adminAccounts.find(a=>a.username.toLowerCase()===u && a.pwd===p);
            if(!findAdmin){alert("账号或者密码错误，请检查");return;}
            currentLoginUser=findAdmin.username;
            currentRole=findAdmin.role||"normal";
            const ck=document.getElementById("rememberCheck").checked;
            if(ck){localStorage.setItem("admin_remember",btoa(JSON.stringify({u,p})));}else{localStorage.removeItem("admin_remember");}
            document.getElementById("loginWrap").style.display="none";
            document.getElementById("adminWrap").style.display="block";
            document.getElementById("curAdminName").innerText=currentLoginUser;
            if(currentRole==="super"){document.querySelectorAll(".super-only").forEach(b=>b.style.display="");}
            renderCatPanel();renderCatSelect();renderGoods();renderOrders();renderBulletins();renderAdminList();
        }
        function logout(){localStorage.removeItem("admin_remember");location.reload();}
        function changePassword(){
            const db=getDb();const admin=db.adminAccounts.find(a=>a.username===currentLoginUser);
            const old=document.getElementById("oldPwd").value.trim();
            const np=document.getElementById("newPwd").value.trim();
            const cp=document.getElementById("confirmPwd").value.trim();
            if(old!==admin.pwd){alert("原密码错误");return;}
            if(np.length<6){alert("新密码至少6位");return;}
            if(np!==cp){alert("两次输入新密码不一致");return;}
            admin.pwd=np;saveDb(db);alert("密码修改成功，请重新登录");localStorage.removeItem("admin_remember");location.reload();
        }
        function addNewAdmin(){
            if(currentRole!=="super"){alert("无权限");return;}
            const db=getDb();
            const nu=document.getElementById("newAdminUser").value.trim().toLowerCase();
            const np=document.getElementById("newAdminPwd").value.trim();
            const isSuper=document.getElementById("newAdminSuper").checked;
            if(!nu||!np){alert("账号密码不能为空");return;}
            if(np.length<6){alert("密码至少6位");return;}
            const exist=db.adminAccounts.some(x=>x.username.toLowerCase()===nu);
            if(exist){alert("该管理员账号已存在");return;}
            db.adminAccounts.push({username:nu,pwd:np,role:isSuper?"super":"normal"});
            saveDb(db);alert("管理员新增完成");
            document.getElementById("newAdminUser").value="";document.getElementById("newAdminPwd").value="";document.getElementById("newAdminSuper").checked=false;
            renderAdminList();
        }
        function renderAdminList(){
            if(currentRole!=="super")return;
            const db=getDb();const wrap=document.getElementById("adminListWrap");
            wrap.innerHTML="";
            if(db.adminAccounts.length===0){
                wrap.innerHTML='<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-text">暂无管理员</div></div>';
                return;
            }
            db.adminAccounts.forEach(a=>{
                const isSelf=a.username===currentLoginUser;
                wrap.innerHTML+=`
                <div style="padding:10px 0;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;">
                    <div><b>${a.username}</b> ${a.role==="super"?"<span class='badge badge-done'>超级管理员</span>":"<span class='badge badge-pending'>普通管理员</span>"}</div>
                    ${!isSelf?`<button class="danger" onclick="delAdmin('${a.username}')">删除</button>`:"<span class='small-tip'>当前账号</span>"}
                </div>`;
            });
        }
        window.delAdmin=function(username){
            if(currentRole!=="super"){alert("无权限");return;}
            if(!confirm("确定删除该管理员？"))return;
            const db=getDb();
            const target=db.adminAccounts.find(a=>a.username===username);
            if(target&&target.role==="super"){
                const superCount=db.adminAccounts.filter(a=>a.role==="super").length;
                if(superCount<=1){alert("至少保留一个超级管理员");return;}
            }
            db.adminAccounts=db.adminAccounts.filter(a=>a.username!==username);
            saveDb(db);renderAdminList();
        }
        function switchTab(tabId,btn){
            document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
            document.getElementById(tabId).classList.add("show");
            document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
        }
        function addCat(){
            const name=document.getElementById("catName").value.trim();
            if(!name)return alert("请输入分类名称");
            const db=getDb();db.categories.push({id:"cat_"+Date.now(),name});saveDb(db);
            document.getElementById("catName").value="";renderCatPanel();renderCatSelect();
        }
        function delCat(cid){if(!confirm("确定删除该分类?"))return;const db=getDb();db.categories=db.categories.filter(x=>x.id!==cid);saveDb(db);renderCatPanel();renderCatSelect();}
        function renderCatPanel(){
            const db=getDb();const wrap=document.getElementById("catWrap");
            wrap.innerHTML="<h4>已有分类</h4>";
            if(db.categories.length===0){
                wrap.innerHTML+='<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-text">暂无分类</div></div>';
                return;
            }
            db.categories.forEach(c=>{wrap.innerHTML+=`<div style="padding:8px 0;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;">${c.name} <button class="danger" onclick="delCat('${c.id}')">删除</button></div>`;});
        }
        function renderCatSelect(){
            const db=getDb();const sel=document.getElementById("gCat");
            sel.innerHTML=`<option value="">请选择分类</option>`;
            db.categories.forEach(c=>sel.innerHTML+=`<option value="${c.id}">${c.name}</option>`);
        }
        document.getElementById("imgUpload").onchange=function(e){
            const f=e.target.files[0];if(!f)return;
            const r=new FileReader();
            r.onload=ev=>{document.getElementById("imgPreview").src=ev.target.result;document.getElementById("imgPreview").style.display="block";};
            r.readAsDataURL(f);
        }
        function saveGoods(){
            const name=document.getElementById("gName").value.trim();
            const price=document.getElementById("gPrice").value.trim();
            const catId=document.getElementById("gCat").value;
            const desc=document.getElementById("gDesc").value.trim();
            const imgSrc=document.getElementById("imgPreview").src;
            const sellout=document.getElementById("isSelloutEdit").checked;
            if(!name||!price||!imgSrc||!catId){alert("名称、编号、分类、图片不能为空");return;}
            const db=getDb();
            if(editTargetId){
                const idx=db.goods.findIndex(x=>x.id===editTargetId);
                db.goods[idx]={id:editTargetId,name,price,catId,desc,img:imgSrc,sellout:sellout};
                editTargetId=null;
            }else{
                db.goods.push({id:Date.now(),name,price,catId,desc,img:imgSrc,sellout:sellout});
            }
            saveDb(db);alert("保存成功");
            document.getElementById("gName").value="";document.getElementById("gPrice").value="";document.getElementById("gCat").value="";
            document.getElementById("gDesc").value="";document.getElementById("isSelloutEdit").checked=false;
            document.getElementById("imgPreview").style.display="none";document.getElementById("imgUpload").value="";
            renderGoods();
        }
        function renderGoods(){
            const db=getDb();const wrap=document.getElementById("goodsWrap");wrap.innerHTML="";
            if(db.goods.length===0){
                wrap.innerHTML='<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">暂无物品，去新增一个吧</div></div>';
                return;
            }
            db.goods.forEach(g=>{
                const div=document.createElement("div");div.className="goods-item";
                div.innerHTML=`
                    <div class="goods-item-header">
                        <div class="goods-item-name">${g.name} <span style="color:var(--text-muted);font-weight:400;font-size:13px">No.${g.price}</span></div>
                        ${g.sellout?'<span class="badge badge-sellout">无库存</span>':'<span class="badge badge-sale">正常</span>'}
                    </div>
                    <div class="goods-item-desc">${g.desc||'暂无描述'}</div>
                    <div class="goods-item-actions">
                        <button class="primary" onclick="editItem(${g.id})">编辑</button>
                        <button class="${g.sellout?'ok':'warning'}" onclick="toggleSellout(${g.id})">${g.sellout?"恢复正常":"标记无库存"}</button>
                        <button class="danger" onclick="delItem(${g.id})">删除</button>
                    </div>
                `;
                wrap.appendChild(div);
            });
        }
        window.toggleSellout=function(gid){const db=getDb();const g=db.goods.find(x=>x.id===gid);g.sellout=!g.sellout;saveDb(db);renderGoods();}
        window.editItem=function(id){
            const db=getDb();const g=db.goods.find(x=>x.id===id);
            editTargetId=id;
            document.getElementById("gName").value=g.name;document.getElementById("gPrice").value=g.price;
            document.getElementById("gCat").value=g.catId;document.getElementById("gDesc").value=g.desc;
            document.getElementById("isSelloutEdit").checked=!!g.sellout;
            document.getElementById("imgPreview").src=g.img;document.getElementById("imgPreview").style.display="block";
            document.querySelector('.tab-btn[onclick*="addGoods"]').click();
        }
        window.delItem=function(id){if(!confirm("确认删除该物品吗？"))return;const db=getDb();db.goods=db.goods.filter(x=>x.id!==id);saveDb(db);renderGoods();}
        function renderOrders(){
            const db=getDb();const wrap=document.getElementById("orderWrap");wrap.innerHTML="";
            const pendingCount=db.orders.filter(o=>o.status==="pending").length;
            document.getElementById("orderBadge").innerText=pendingCount>0?`【待处理:${pendingCount}】`:"";
            if(db.orders.length===0){wrap.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无提交记录</div></div>';return;}
            db.orders.forEach(o=>{
                let itemHtml="";o.items.forEach(it=>itemHtml+=`<div>• ${it.goodsName} ×${it.qty}  <span style="float:right">${it.sub}</span></div>`);
                wrap.innerHTML+=`
                <div class="order-item">
                    <div class="order-item-header">记录编号：${o.orderNo} ${o.status==="pending"?'<span class="badge badge-pending">待处理</span>':'<span class="badge badge-done">已处理</span>'}</div>
                    <div class="order-item-detail">
                        <div>客户设备：${o.deviceId.substring(0,12)}...</div>
                        <div class="order-items-list">${itemHtml}<div style="border-top:1px dashed var(--border);margin-top:6px;padding-top:6px;font-weight:600;color:var(--text)">合计：${o.total}</div></div>
                        <div>姓名：${o.userName}｜电话：${o.userPhone}</div>
                        <div>联系地址：${o.userAddr}</div>
                        <div>备注：${o.note||"无"}</div>
                        <div class="small-tip">提交时间：${o.createTime}</div>
                    </div>
                    <div style="margin-top:10px;">
                        ${o.status==='pending'?`<button class="ok" onclick="setOrderDone('${o.orderNo}')">标记已处理</button>`:`<button class="warning" onclick="setOrderPending('${o.orderNo}')">恢复待处理</button>`}
                    </div>
                </div>`;
            });
        }
        window.setOrderDone=function(ordNo){const db=getDb();const o=db.orders.find(x=>x.orderNo===ordNo);o.status="done";saveDb(db);renderOrders();}
        window.setOrderPending=function(ordNo){const db=getDb();const o=db.orders.find(x=>x.orderNo===ordNo);o.status="pending";saveDb(db);renderOrders();}
        function addBulletin(){
            const db=getDb();const content=document.getElementById("bulletinContent").value.trim();
            const enable=document.getElementById("bulletinEnable").checked;
            if(!content){alert("公告内容不能为空");return;}
            db.bulletins.push({bid:"bul_"+Date.now(),content:content,enable:enable});
            saveDb(db);alert("公告保存成功");
            document.getElementById("bulletinContent").value="";document.getElementById("bulletinEnable").checked=false;
            renderBulletins();
        }
        window.delBulletin=function(bid){if(!confirm("确定删除这条公告？"))return;const db=getDb();db.bulletins=db.bulletins.filter(b=>b.bid!==bid);saveDb(db);renderBulletins();}
        window.toggleBulletinEnable=function(bid){const db=getDb();const b=db.bulletins.find(x=>x.bid===bid);b.enable=!b.enable;saveDb(db);renderBulletins();}
        function renderBulletins(){
            const db=getDb();const wrap=document.getElementById("bulletinWrap");
            wrap.innerHTML="<h4>已创建公告列表</h4>";
            if(db.bulletins.length===0){wrap.innerHTML+='<div class="empty-state"><div class="empty-icon">📢</div><div class="empty-text">暂无公告</div></div>';return;}
            db.bulletins.forEach(b=>{
                wrap.innerHTML+=`
                <div style="padding:10px 0;border-bottom:1px solid #f3f4f6;">
                    <div style="margin-bottom:6px;">${b.content} ${b.enable?"<span class='badge badge-done'>已启用</span>":"<span class='badge badge-pending'>已关闭</span>"}</div>
                    <button class="primary" onclick="toggleBulletinEnable('${b.bid}')">${b.enable?"关闭公告":"启用公告"}</button>
                    <button class="danger" onclick="delBulletin('${b.bid}')">删除</button>
                </div>`;
            });
        }
    </script>
</body>
</html>
